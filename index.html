:root{--b:#f5f7f9;--t:#111;--c:#fff;--l:#d9e1ea;--a:#246b52;--g:#177245;--r:#c43131;--m:#667085}body.dark{--b:#101314;--t:#e8eef0;--c:#171b1d;--l:#2c353a;--a:#6fc08e;--g:#70d99b;--r:#ff8585;--m:#a7b1b7}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1060px;margin:auto;padding:18px}header{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}h1{margin:0;color:var(--a);font-size:22px}.sub,footer{color:var(--m);font-size:13px}.ctl{display:flex;gap:8px;flex-wrap:wrap}button,select,.chip{border:1px solid var(--l);border-radius:8px;padding:8px 10px;background:var(--c);color:var(--t)}button.primary{background:var(--a);color:white;font-weight:700;cursor:pointer}.q{background:var(--c);border:1px solid var(--l);border-radius:8px;margin:12px 0;padding:14px}.qt{font-weight:750;line-height:1.45;white-space:pre-line}.meta{color:var(--m);font-size:12px;margin:5px 0 9px}.ch{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--l);border-radius:8px;padding:9px;margin:7px 0;cursor:pointer}.ok{border-color:var(--g);background:#e8f6ee;color:var(--g);font-weight:700}.ko{border-color:var(--r);background:#fdecec;color:var(--r);font-weight:700}body.dark .ok{background:#143323}body.dark .ko{background:#3a1b1b}.tag{margin-left:auto;font-size:12px}.exp{display:none;border:1px solid var(--l);border-radius:8px;padding:10px;margin-top:10px;line-height:1.45}.res,.note{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:12px;margin:12px 0}.res{text-align:center;font-weight:800}@media(max-width:680px){header{display:block}.ctl{margin-top:10px}}
</style></head><body><div class="wrap"><header><div><h1>QCM CCNA Cisco</h1><div class="sub">124 questions extraites de CCNA.odt</div></div><div class="ctl"><span class="chip" id="p">0/0 répondu</span><span class="chip" id="tm">00:00</span><select id="sel"></select><button id="dark">☾</button><button class="primary" id="val">Valider</button><button class="primary" id="new" style="display:none">Recommencer</button></div></header><div id="note" class="note" style="display:none"></div><div id="quiz"></div><div id="res"></div><footer>La correction affiche vos choix, les bonnes réponses, les erreurs et les explications quand elles existent.</footer></div>
<script>const Q=[{"n": 1, "q": "Un administrateur a défini un compte d’utilisateur local avec un mot de passe secret sur le routeur R1 pour être utiliser avec SSH. Quelles sont les trois étapes supplémentaires nécessaires pour configurer R1 pour accepter uniquement les connexions SSH chiffrées ? (Choisissez trois réponses.)", "o": ["Activez les sessions SSH entrantes à l’aide des commandes de ligne VTY.", "Configurer le nom de domaine IP.", "Générez des clés pré-partagées bidirectionnelles.", "Configurez DNS sur le routeur.", "Activez les sessions Telnet entrantes à l’aide des commandes de ligne VTY.", "Générer les clés SSH."], "a": ["Activez les sessions SSH entrantes à l’aide des commandes de ligne VTY.", "Configurer le nom de domaine IP.", "Générer les clés SSH."], "e": ""}, {"n": 2, "q": "Que sont les protocoles propriétaires ?", "o": ["Des protocoles qui peuvent être librement utilisés par toute entreprise ou tout fournisseur", "Un ensemble de protocoles connus sous le nom de suite de protocoles TCP/IP", "Des protocoles développés par des entreprises qui contrôlent leur définition et leur fonctionnement", "Des protocoles développés par des organismes privés pour fonctionner avec du matériel provenant de tout fournisseur"], "a": ["Des protocoles développés par des entreprises qui contrôlent leur définition et leur fonctionnement"], "e": "Les protocoles propriétaires ont leur définition et leur fonctionnement contrôlés par une entreprise ou un fournisseur. Certains d’entre eux peuvent être utilisés par différentes organisations avec l’autorisation du propriétaire. La suite de protocoles TCP/IP est une norme ouverte et non un protocole propriétaire."}, {"n": 4, "q": "Un administrateur réseau ajoute un nouveau réseau local à une filiale. Le nouveau réseau local doit prendre en charge 4 périphériques connectés. Quel est le plus petit masque réseau que l’administrateur réseau peut utiliser pour le nouveau réseau?", "o": ["255.255.255.224", "255.255.255.248", "255.255.255.128", "255.255.255.192"], "a": ["255.255.255.248"], "e": ""}, {"n": 5, "q": "À quoi sert le glissement de fenêtre TCP ?", "o": ["À mettre fin à une communication une fois la transmission des données complète", "À demander à une source de réduire la vitesse à laquelle elle transmet les données", "À informer une source qu’elle doit retransmettre les données à partir d’un point particulier", "À s’assurer que les segments parviennent à la destination dans l’ordre"], "a": ["À demander à une source de réduire la vitesse à laquelle elle transmet les données"], "e": "Le mécanisme de glissement de fenêtre TCP permet à un périphérique de destination de demander à une source de ralentir la transmission. Pour ce faire, il réduit la valeur contenue dans le champ de taille de fenêtre du segment. Ce sont les accusés de réception qui servent à demander la retransmission à partir d’un point particulier. Ce sont les numéros d’ordre qui servent à s’assurer que les segments arrivent dans le bon ordre. Enfin, c’est un bit de contrôle FIN qui sert à mettre fin à une session de communication."}, {"n": 6, "q": "Des données sont envoyées depuis un ordinateur source vers un serveur de destination. Quelles sont les trois affirmations qui décrivent la fonction TCP ou UDP dans cette situation ? (Choisissez trois réponses.)", "o": ["Le champ Port source identifie l’application ou le service actif qui traitera les données renvoyées à l’ordinateur.", "Le processus TCP exécuté sur l’ordinateur sélectionne le port de destination de façon aléatoire lors de l’établissement d’une session via le serveur.", "Des segments UDP sont encapsulés dans des paquets IP pour le transport via le réseau.", "Le numéro de port source TCP identifie l’hôte émetteur sur le réseau.", "Le numéro de port de destination UDP identifie l’application ou le service du serveur destiné au traitement des données.", "TCP est le protocole le plus adapté lorsqu’une fonction requiert une surcharge réseau plus faible."], "a": ["Le champ Port source identifie l’application ou le service actif qui traitera les données renvoyées à l’ordinateur.", "Des segments UDP sont encapsulés dans des paquets IP pour le transport via le réseau.", "Le numéro de port de destination UDP identifie l’application ou le service du serveur destiné au traitement des données."], "e": "Les numéros de port de couche 4 identifient l’application ou le service qui gérera les données. Le numéro de port source est ajouté par l’appareil expéditeur et sera le numéro de port de destination lorsque les informations demandées seront renvoyées. Les segments de couche 4 sont encapsulés dans des paquets IP. UDP, et non TCP, est utilisé lorsqu’une faible surcharge est nécessaire. Une adresse IP source, et non un numéro de port source TCP, identifie l’hôte expéditeur sur le réseau. Les numéros de port de destination sont des ports spécifiques qu’une application serveur ou un service surveille pour les demandes."}, {"n": 7, "q": "Un serveur reçoit un paquet client. Le numéro de port de destination du paquet est 69. Quelle application de service le client demande-t-il?", "o": ["DNS", "SMTP", "TFTP", "DHCP"], "a": ["TFTP"], "e": ""}, {"n": 8, "q": "Quelle caractéristique décrit un cheval de Troie?", "o": ["logiciel ou code malveillant s’exécutant sur un périphérique final", "l’utilisation d’informations d’identification volées pour accéder à des données privées", "une attaque qui ralentit ou bloque un périphérique ou un service réseau", "un périphérique réseau qui filtre l’accès et le trafic entrant dans un réseau"], "a": ["logiciel ou code malveillant s’exécutant sur un périphérique final"], "e": ""}, {"n": 9, "q": "Quels sont les deux problèmes qui peuvent être causés par un grand nombre de requêtes ARP et de messages de réponse? (Choisissez deux réponses.)", "o": ["Les commutateurs sont surchargés car ils concentrent tout le trafic des sous-réseaux connectés.", "Tous les messages de requête ARP doivent être traités par tous les nœuds du réseau local.", "Le réseau peut être saturé car les messages de réponse ARP ont une charge utile très importante grâce à l’adresse MAC de 48 bits et à l’adresse IP de 32 bits qu’ils contiennent.", "La requête ARP est envoyée en tant que diffusion et inondera l’ensemble du sous-réseau.", "Un grand nombre de messages de requête et de réponse ARP peuvent ralentir le processus de commutation, ce qui conduit le commutateur à apporter de nombreuses modifications dans sa table MAC."], "a": ["Tous les messages de requête ARP doivent être traités par tous les nœuds du réseau local.", "La requête ARP est envoyée en tant que diffusion et inondera l’ensemble du sous-réseau."], "e": "Les requêtes ARP sont envoyées sous forme de diffusion :(1) Tous les nœuds les recevront et ils seront traités par logiciel, interrompant le CPU.(2) Le commutateur transmet (inonde) les diffusions de couche 2 vers tous les ports.Un commutateur ne modifie pas sa table MAC en fonction des messages de demande ou de réponse ARP. Le commutateur remplit la table MAC en utilisant l’adresse MAC source de toutes les trames. La charge utile ARP est très petite et ne surcharge pas le commutateur."}, {"n": 10, "q": "Quelle commande peut être utilisée sur un PC Windows pour afficher la configuration IP de cet ordinateur ?", "o": ["ipconfig", "ping", "show ip interface brief", "show interfaces"], "a": ["ipconfig"], "e": ""}, {"n": 11, "q": "Comment la commande service password-encryption améliore-t-elle la sécurité des mots de passe sur des routeurs et des commutateurs Cisco ?", "o": ["Elle demande à l’utilisateur d’entrer des mots de passe chiffrés pour obtenir un accès à la console sur un routeur ou un commutateur.", "Elle nécessite que des mots de passe soient utilisés lors d’une connexion distante à un routeur ou à un commutateur avec Telnet.", "Elle chiffre les mots de passe qui sont stockés dans des fichiers de configuration de routeur et de commutateur.", "Elle chiffre les mots de passe lorsqu’ils sont transmis sur le réseau."], "a": ["Elle chiffre les mots de passe qui sont stockés dans des fichiers de configuration de routeur et de commutateur."], "e": "La commande service password-encryption crypte les mots de passe en clair dans le fichier de configuration afin qu’ils ne puissent pas être consultés par des utilisateurs non autorisés."}, {"n": 12, "q": "Quel mécanisme est utilisé par un routeur pour empêcher un paquet IPv4 reçu de voyager sans fin sur un réseau ?", "o": ["Il décrémente la valeur du champ TTL de 1 et si le résultat est 0, il rejette le paquet et envoie un message « Time Exceeded » à l’hôte source.", "Il vérifie la valeur du champ TTL et si elle est égale à 0, il rejette le paquet et envoie un message « Destination Unreachable » à l’hôte source.", "Il incrémente la valeur du champ TTL de 1 et si le résultat est 100, il rejette le paquet et envoie un message « Parameter Problem » à l’hôte source.", "Il vérifie la valeur du champ TTL et si elle est égale à 100, il rejette le paquet et envoie un message « Destination Unreachable » à l’hôte source."], "a": ["Il décrémente la valeur du champ TTL de 1 et si le résultat est 0, il rejette le paquet et envoie un message « Time Exceeded » à l’hôte source."], "e": ""}, {"n": 13, "q": "Quel service est fourni par HTTPS?", "o": ["Utilise le cryptage pour sécuriser l’échange de texte, d’images graphiques, de sons et de vidéos sur le Web.", "Traduit des noms de domaines (par exemple, cisco.com) en adresses IP", "Permet l’accès à distance aux périphériques et serveurs réseau.", "Utilise le chiffrement pour fournir un accès distant sécurisé aux périphériques et serveurs réseau."], "a": ["Utilise le cryptage pour sécuriser l’échange de texte, d’images graphiques, de sons et de vidéos sur le Web."], "e": ""}, {"n": 14, "q": "Quelles sont les deux déclarations qui décrivent les caractéristiques d’une table de routage IPv4 sur un routeur ? (Choisissez deux réponses.)", "o": ["La table de routage répertorie les adresses MAC de chaque interface active.", "Il stocke des informations sur les chemins dérivés des interfaces de routeur actives.", "Si une route statique par défaut est configurée sur le routeur, une entrée sera incluse dans la table de routage avec le code source S .", "S’il existe deux ou plusieurs chemins possibles vers la même destination, le chemin associé à la valeur métrique la plus élevée est inclus dans le tableau d’acheminement.", "Les interfaces connectées directement ont deux codes d’origine dans la table de routage: C et S .", "La commande netstat -r permettent d’afficher la table de routage de l’hôte."], "a": ["Si une route statique par défaut est configurée sur le routeur, une entrée sera incluse dans la table de routage avec le code source S .", "Les interfaces connectées directement ont deux codes d’origine dans la table de routage: C et S ."], "e": ""}, {"n": 15, "q": "Quelle valeur, qui se trouve dans un champ d’en-tête IPv4, est diminuée par chaque routeur qui reçoit un paquet ?", "o": ["Décalage du fragment", "Time To Live (durée de vie)", "Longueur d’en-tête", "Services différenciés"], "a": ["Time To Live (durée de vie)"], "e": "Lorsqu’un routeur reçoit un paquet, le routeur décrémentera le champ Time-to-Live (TTL) de un. Lorsque le champ atteint zéro, le routeur destinataire rejettera le paquet et enverra un message ICMP Time Exceeded à l’expéditeur."}, {"n": 17, "q": "La commande de configuration globale ip default-gateway 172.16.100.1 est appliquée sur un commutateur. Quel est l’effet de cette commande?", "o": ["Le commutateur est limité à l’envoi et à la réception de trames vers et depuis la passerelle 172.16.100.1.", "Le commutateur aura une interface de gestion avec l’adresse 172.16.100.1.", "Le commutateur peut communiquer avec d’autres hôtes du réseau 172.16.100.0.", "Le commutateur peut être géré à distance à partir d’un hôte sur un autre réseau."], "a": ["Le commutateur peut être géré à distance à partir d’un hôte sur un autre réseau."], "e": "Une adresse de passerelle par défaut est généralement configurée sur tous les appareils pour leur permettre de communiquer au-delà de leur réseau local. Dans un commutateur, cela est réalisé à l’aide de la commande ip default-gateway < adresse IP>."}, {"n": 18, "q": "Un nouvel administrateur de réseau a été invité à saisir un message de bannière sur un appareil Cisco. Quel est le moyen le plus rapide pour un administrateur de réseau de vérifier si la bannière est correctement configurée ?", "o": ["Quittez le mode d’exécution privilégié et appuyez sur Enter .", "Quittez le mode de configuration globale.", "Éteignez le téléphone puis rallumez-le.", "Redémarrez l’appareil.", "Saisissez CTRL-Z à l’invite de mode privilégié."], "a": ["Quittez le mode d’exécution privilégié et appuyez sur Enter ."], "e": "À l’invite de mode privilégié telle que Router#, tapez exit , appuyez sur Enter et le message de la bannière s’affiche. La mise sous tension d’un périphérique réseau ayant reçu la commande banner motd affichera également le message de la bannière, mais ce n’est pas un façon efficace de tester la configuration."}, {"n": 19, "q": "Quelle méthode est utilisée pour gérer l’accès avec gestion des conflits sur un réseau sans fil ?", "o": ["Classement des priorités", "CSMA/CD", "Passage de jeton", "CSMA/CA"], "a": ["CSMA/CA"], "e": "La méthode CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance) est utilisée avec la technologie sans fil pour gérer les conflits de supports. La méthode CSMA/CD (Carrier Sense Multiple Access with Collision Detection) est utilisée avec la technologie Ethernet pour gérer les conflits de supports. Le classement des priorités et le passage de jeton ne sont pas utilisés pour le contrôle d’accès au support."}, {"n": 20, "q": "Parmi les caractéristiques suivantes, lesquelles sont des caractéristiques du processus CSMA/CD ? (Choisissez trois réponses.)", "o": ["Un signal d’encombrement indique que la collision de paquets a été résolue et que le support n’est plus occupé.", "Tous les périphériques d’un segment ont accès aux données transitant par le support réseau.", "Les périphériques peuvent se voir attribuer une priorité de transmission supérieure.", "Suite à la détection d’une collision, les hôtes peuvent tenter de reprendre leur transmission après un délai aléatoire.", "Le périphérique doté d’un jeton électronique est le seul autorisé à transmettre des données après une collision.", "Un périphérique est à l’écoute du support et attend qu’il ne soit plus occupé pour pouvoir transmettre ses données."], "a": ["Tous les périphériques d’un segment ont accès aux données transitant par le support réseau.", "Suite à la détection d’une collision, les hôtes peuvent tenter de reprendre leur transmission après un délai aléatoire.", "Un périphérique est à l’écoute du support et attend qu’il ne soit plus occupé pour pouvoir transmettre ses données."], "e": "Le processus Carrier Sense Multiple Access/Collision Detection (CSMA/CD) est un mécanisme de contrôle d’accès multimédia basé sur la contention utilisé sur les réseaux d’accès multimédia partagés, tels qu’Ethernet. Lorsqu’un appareil a besoin de transmettre des données, il écoute et attend que le support soit disponible (silencieux), puis il enverra des données. Si deux appareils transmettent en même temps, une collision se produira. Les deux appareils détecteront la collision sur le réseau. Lorsqu’un appareil détecte une collision, il arrête le processus de transmission des données, attend un temps aléatoire, puis réessaye."}, {"n": 21, "q": "Quel champ de trame est créé par un nœud source et utilisé par un nœud de destination pour s’assurer qu’un signal de données transmis n’a pas été modifié par interférence, distorsion ou perte de signal?", "o": ["Champ Séquence de contrôle de trame", "champ de processus de correction d’erreur", "Protocole UDP (User Datagram Protocol)", "Champ de contrôle de flux", "champ de vérification des erreurs de couche de transport"], "a": ["Champ Séquence de contrôle de trame"], "e": ""}, {"n": 22, "q": "Quelle technologie sans fil a des besoins en termes de consommation d’énergie et de débit des données qui la rendent populaire dans les applications domotiques ?", "o": ["Wi-Fi", "LoRaWAN", "5 G", "ZigBee"], "a": ["ZigBee"], "e": ""}, {"n": 24, "q": "Un administrateur réseau conçoit la structure d’un nouveau réseau sans fil. Quels points problématiques doivent être pris en compte lors de la conception d’un réseau sans fil ? (Choisissez trois réponses.)", "o": ["Câblage étendu", "Collision de paquet", "Options de mobilité", "Zone de couverture", "Perturbation", "Sécurité"], "a": ["Zone de couverture", "Perturbation", "Sécurité"], "e": ""}, {"n": 26, "q": "Un administrateur réseau souhaite avoir le même masque de sous-réseau pour tous les réseaux d’un petit site. Le site a les réseaux et numéros de périphérique suivants :\nTéléphones IP – 22 adresses\nPC – 20 adresses nécessaires\nImprimantes – 2 adresses nécessaires\nScanners – 2 adresses nécessaires\nL’administrateur réseau juge que 192.168.10.0/24 doit être le réseau utilisé sur ce site. Quel masque de sous-réseau permettrait d’utiliser de manière optimale les adresses disponibles pour les quatre sous-réseaux ?", "o": ["255.255.255.224", "255.255.255.252", "255.255.255.248", "255.255.255.192", "255.255.255.0", "255.255.255.240"], "a": ["255.255.255.224"], "e": ""}, {"n": 28, "q": "Quelles sont les deux fonctions d’exécution sur la sous-couche MAC de la couche de liaison de données OSI pour faciliter la communication Ethernet? (Choisissez deux réponses.)\nCas 1:\nCas 2:\nCas 3:\nCas 4:\nCas 5:", "o": ["applique la délimitation des champs de trames Ethernet pour synchroniser la communication entre les nœuds", "ajoute des informations de contrôle Ethernet aux données du protocole réseau", "Met en œuvre la queue de bande avec la séquence de vérification de trame pour la détection des erreurs", "Place les informations dans la trame qui indique le protocole de couche réseau encapsulé pour la trame.", "gère la communication entre le logiciel de mise en réseau de la couche supérieure et le matériel de carte réseau Ethernet", "ajoute des informations de contrôle Ethernet aux données du protocole réseau", "met en œuvre CSMA/CD sur un support semi-duplex partagé hérité", "gère la communication entre le logiciel de mise en réseau de la couche supérieure et le matériel de carte réseau Ethernet", "intègre des flux de couche 2 entre 10 Gigabit Ethernet sur fibre et 1 Gigabit Ethernet sur cuivre", "permet à IPv4 et IPv6 d’utiliser le même support physique", "place les informations dans l’Ethernettrame qui identifie quel protocole de couche réseau est encapsulé par la trame", "ajoute des informations de contrôle Ethernet aux données de protocole réseau", "responsable de la structure interne de la trame Ethernet", "permet à IPv4 et IPv6 d’utiliser le même support physique", "implémente une bande-annonce avec séquence de contrôle de trame pour la détection d’erreurs", "intègre les flux de couche 2 entre 10 Gigabit Ethernet sur fibre et 1 Gigabit Ethernet sur cuivre", "permet à IPv4 et IPv6 d’utiliser le même support physique", "gère la communication entre le logiciel de mise en réseau de la couche supérieure et le matériel de carte réseau Ethernet", "ajoute des informations de contrôle Ethernet aux données de protocole réseau", "implémente CSMA/CD sur les médias semi-duplex partagés hérités", "applique la délimitation des champs de trames Ethernet pour synchroniser la communication entre les nœuds", "ajoute des informations de contrôle Ethernet aux données du protocole réseau", "Place les informations dans la trame qui indique le protocole de couche réseau encapsulé pour la trame.", "applique les adresses MAC source et destination à la trame Ethernet", "gère la communication entre le logiciel de mise en réseau de la couche supérieure et le matériel de carte réseau Ethernet"], "a": ["applique la délimitation des champs de trames Ethernet pour synchroniser la communication entre les nœuds", "Met en œuvre la queue de bande avec la séquence de vérification de trame pour la détection des erreurs", "met en œuvre CSMA/CD sur un support semi-duplex partagé hérité", "intègre des flux de couche 2 entre 10 Gigabit Ethernet sur fibre et 1 Gigabit Ethernet sur cuivre", "responsable de la structure interne de la trame Ethernet", "implémente une bande-annonce avec séquence de contrôle de trame pour la détection d’erreurs", "intègre les flux de couche 2 entre 10 Gigabit Ethernet sur fibre et 1 Gigabit Ethernet sur cuivre", "implémente CSMA/CD sur les médias semi-duplex partagés hérités", "applique les adresses MAC source et destination à la trame Ethernet"], "e": ""}, {"n": 29, "q": "Les utilisateurs se plaignent de délais allongés lors de l’authentification et de l’accès aux ressources réseau à certains moments de la semaine. Quel type d’information les ingénieurs réseau doivent-ils vérifier pour savoir si cette situation s’inscrit dans un comportement normal du réseau ?", "o": ["Les enregistrements et messages syslog", "Le résultat de la commande debug et les captures de paquets", "Les performances de référence du réseau", "Les fichiers de configuration réseau"], "a": ["Les performances de référence du réseau"], "e": ""}, {"n": 30, "q": "Un groupe de PC Windows se trouvant sur un nouveau sous-réseau a été ajouté à un réseau Ethernet. Lors de tests de connectivité, un technicien découvre que ces ordinateurs peuvent accéder aux ressources du réseau local, mais pas à celles d’Internet. Pour résoudre le problème, le technicien souhaite d’abord vérifier les configurations des adresses IP et du DNS sur les ordinateurs, et la connectivité au routeur local. Quels sont les trois utilitaires et commandes d’interface de ligne de commande Windows qui fourniront les informations nécessaires ? (Choisissez trois réponses.)", "o": ["telnet", "ipconfig", "tracert", "netsh interface ipv6 show neighbor", "ping", "arp -a", "nslookup"], "a": ["ipconfig", "ping", "nslookup"], "e": ""}, {"n": 31, "q": "Quel type de serveur s’appuie sur des types d’enregistrements tels que A, NS, AAAA et MX pour fournir des services?", "o": ["DNS", "Web", "fichier", "les e-mails"], "a": ["DNS"], "e": "Un serveur DNS stocke les enregistrements utilisés pour résoudre les adresses IP en noms d’hôtes. Certains types d’enregistrement DNS sont les suivants :A – une adresse IPv4 de périphérique finalNS – un serveur de noms faisant autoritéAAAA – une adresse IPv6 de périphérique finalMX – un enregistrement d’échange de courrier"}, {"n": 32, "q": "Un technicien réussit à envoyer une requête ping pour l’adresse IP du serveur d’une entreprise distante, mais pas pour l’adresse URL de ce même serveur web. Quelle commande doit-il exécuter pour diagnostiquer ce problème ?", "o": ["tracert", "nslookup", "ipconfig", "netstat"], "a": ["nslookup"], "e": "Traceroute (tracert) est un utilitaire qui génère une liste de sauts qui ont été atteints avec succès le long du chemin de la source à la destination. Cette liste peut fournir des informations importantes de vérification et de dépannage. L’utilitaire ipconfig est utilisé pour afficher les paramètres de configuration IP sur un PC Windows. L’utilitaire Netstat est utilisé pour identifier les connexions TCP actives ouvertes et en cours d’exécution sur un hôte en réseau. Nslookup est un utilitaire qui permet à l’utilisateur d’interroger manuellement les serveurs de noms pour résoudre un nom d’hôte donné. Cet utilitaire peut également être utilisé pour résoudre les problèmes de résolution de noms et pour vérifier l’état actuel des serveurs de noms."}, {"n": 34, "q": "Quelles propositions relatives aux adresses IP et MAC dans le cadre de la transmission des données si NAT n’est pas impliquée sont exactes ? (Choisissez deux réponses.)", "o": ["Chaque fois qu’une trame est encapsulée avec une nouvelle adresse MAC de destination, une nouvelle adresse IP de destination est nécessaire.", "Les adresses MAC de destination ne changent jamais dans une trame qui traverse sept routeurs.", "Un paquet qui a traversé quatre routeurs a modifié l’adresse IP de destination quatre fois.", "Les adresses IP de destination d’un en-tête de paquet restent les mêmes tout au long du chemin vers un hôte cible.", "Les adresses MAC source et de destination ont une signification locale et changent chaque fois qu’une trame passe d’un réseau local à un autre."], "a": ["Les adresses IP de destination d’un en-tête de paquet restent les mêmes tout au long du chemin vers un hôte cible.", "Les adresses MAC source et de destination ont une signification locale et changent chaque fois qu’une trame passe d’un réseau local à un autre."], "e": ""}, {"n": 36, "q": "Quel avantage présente l’utilisation du cloud computing dans les réseaux ?", "o": ["Les utilisateurs finaux sont libres d’utiliser leurs propres outils pour accéder aux informations de l’entreprise et communiquer au sein de leur réseau.", "Les technologies sont intégrées à des appareils que l’on utilise tous les jours pour qu’ils puissent se connecter à d’autres terminaux, ce qui les rend plus intelligents ou automatisés.", "L’entreprise améliore les capacités de son réseau sans investissement supplémentaire dans une infrastructure, du personnel ou des logiciels.", "Un réseau domestique utilise le câblage électrique existant pour se connecter aux terminaux du réseau à partir d’une simple prise de courant, ce qui permet d’économiser sur les coûts d’installation de câbles de données."], "a": ["L’entreprise améliore les capacités de son réseau sans investissement supplémentaire dans une infrastructure, du personnel ou des logiciels."], "e": ""}, {"n": 37, "q": "Quelles sont les fonctions d’ARP ? (Choisissez deux réponses.)", "o": ["Lorsqu’un hôte encapsule un paquet dans une trame, il fait référence à la table des adresses MAC pour déterminer le mappage des adresses IP en adresses MAC.", "Si le périphérique qui reçoit une requête ARP dispose d’une adresse IPv4 de destination, il renvoie une réponse ARP.", "Si un hôte est prêt à envoyer un paquet à un périphérique de destination locale et qu’il dispose de l’adresse IP mais pas l’adresse MAC de la destination, il génère une diffusion ARP.", "Si aucun périphérique ne répond à la requête ARP, le noeud d’origine diffuse le paquet de données à tous les périphériques du segment de réseau.", "Une requête ARP est envoyée à tous les périphériques du réseau local Ethernet et contient l’adresse IP de l’hôte de destination et son adresse MAC de multidiffusion."], "a": ["Si le périphérique qui reçoit une requête ARP dispose d’une adresse IPv4 de destination, il renvoie une réponse ARP.", "Si un hôte est prêt à envoyer un paquet à un périphérique de destination locale et qu’il dispose de l’adresse IP mais pas l’adresse MAC de la destination, il génère une diffusion ARP."], "e": ""}, {"n": 38, "q": "Quelles couches du modèle OSI équivalent à la couche application du modèle TCP/IP ? (Choisissez trois propositions.)", "o": ["réseau", "application", "transport", "session", "présentation", "liaison de données"], "a": ["application", "session", "présentation"], "e": "Le modèle TCP/IP se compose de quatre couches : application, transport, Internet et accès réseau. Le modèle OSI se compose de sept couches : application, présentation, session, transport, réseau, liaison de données et physique. Les trois couches supérieures du modèle OSI : application, présentation et session correspondent à la couche d’application du modèle TCP/IP."}, {"n": 40, "q": "Quel service est fourni par Internet Messenger ?", "o": ["Traduit des noms de domaines (par exemple, cisco.com) en adresses IP", "Utilise le chiffrement pour fournir un accès distant sécurisé aux périphériques et serveurs réseau.", "Une application qui permet les discussions en ligne en temps réel entre les utilisateurs distants.", "Permet l’accès à distance aux périphériques et serveurs réseau."], "a": ["Une application qui permet les discussions en ligne en temps réel entre les utilisateurs distants."], "e": ""}, {"n": 41, "q": "Quelles commandes peuvent être utilisées sur un hôte Windows pour afficher la table de routage ? (Choisissez deux réponses.)", "o": ["netstat -r", "show ip route", "route print", "tracert", "netstat -s"], "a": ["netstat -r", "route print"], "e": "Sur un hôte Windows, les commandes route print ou netstat -r peuvent être utilisées pour afficher la table de routage de l’hôte. Les deux commandes génèrent la même sortie. Sur un routeur, la commande show ip route est utilisée pour afficher la table de routage. La commande netstat –s est utilisée pour afficher les statistiques par protocole. La commande tracert est utilisée pour afficher le chemin parcouru par un paquet jusqu’à sa destination."}, {"n": 43, "q": "Quel scénario décrit une fonction fournie par la couche transport ?", "o": ["Un employé d’une entreprise accède à un serveur Web situé sur un réseau d’entreprise. La couche transport formate l’écran afin que la page Web s’affiche correctement quel que soit le périphérique utilisé pour accéder au site Web.", "Un étudiant regarde un petit film sur le Web avec le son activé. Le film et le son sont codés dans l’en-tête de la couche transport.", "Un étudiant a deux fenêtres de navigateur Web ouvertes pour accéder à deux sites Web. La couche transport s’assure que la page Web appropriée est envoyée vers la fenêtre de navigateur appropriée.", "Un étudiant utilise un téléphone VoIP d’une salle de classe pour appeler chez lui. L’identifiant unique stocké dans le téléphone est une adresse de couche transport utilisée pour contacter un autre périphérique réseau sur le même réseau."], "a": ["Un étudiant a deux fenêtres de navigateur Web ouvertes pour accéder à deux sites Web. La couche transport s’assure que la page Web appropriée est envoyée vers la fenêtre de navigateur appropriée."], "e": "Les numéros de port source et de destination sont utilisés pour identifier l’application et la fenêtre correctes au sein de cette application."}, {"n": 44, "q": "Que signifie le terme «atténuation» dans la communication de données?", "o": ["temps pour qu’un signal atteigne sa destination", "fuite de signaux d’une paire de câbles à une autre", "renforcement d’un signal par un dispositif de mise en réseau", "perte de puissance du signal à mesure que la distance augmente"], "a": ["perte de puissance du signal à mesure que la distance augmente"], "e": "Les données sont transmises sur les câbles en cuivre sous forme d’impulsions électriques. Un détecteur dans l’interface réseau d’un périphérique de destination doit recevoir un signal pouvant être décodé correctement pour correspondre au signal envoyé. Toutefois, plus le signal voyage longtemps, plus il se détériore. C’est ce qu’on appelle l’atténuation du signal."}, {"n": 45, "q": "Que se passe-t-il si l’adresse de la passerelle par défaut n’est pas correctement configurée sur un hôte ?", "o": ["Le commutateur ne transfère pas les paquets initiés par l’hôte.", "L’hôte ne peut pas communiquer avec les autres hôtes du réseau local.", "L’hôte doit utiliser le protocole ARP pour déterminer l’adresse de la passerelle par défaut.", "Une requête ping exécutée par l’hôte vers 127.0.0.1 échoue.", "L’hôte ne peut pas communiquer avec les hôtes situés sur d’autres réseaux."], "a": ["L’hôte ne peut pas communiquer avec les hôtes situés sur d’autres réseaux."], "e": "Lorsqu’un hôte doit envoyer un message à un autre hôte du même réseau, il transfère directement le message. Cependant, lorsqu’un hôte doit envoyer un message à un réseau distant, il doit utiliser le routeur, également connu sous le nom de « passerelle par défaut ». En effet, l’adresse de la trame liaison de données de l’hôte de destination à distance ne peut pas être utilisée directement. Au lieu de cela, le paquet IP doit être envoyé au routeur (passerelle par défaut). Le routeur transfèrera ensuite le paquet vers sa destination. Par conséquent, si la passerelle par défaut n’est pas configurée correctement, l’hôte peut communiquer avec d’autres hôtes sur le même réseau, mais pas avec les hôtes des réseaux distants."}, {"n": 46, "q": "Les utilisateurs signalent que l’accès réseau est lent. Après avoir questionné les employés, l’administrateur réseau a découvert que l’un d’eux a téléchargé un programme de numérisation tiers pour l’imprimante. Quel type de malware peut ralentir les performances du réseau ?", "o": ["phishing", "ver", "virus", "courrier indésirable"], "a": ["ver"], "e": "Un spécialiste de la cybersécurité doit se familiariser avec les caractéristiques des différents types de logiciels malveillants et d’attaques qui menacent une organisation."}, {"n": 47, "q": "Quelle est la conséquence de la configuration d’un routeur avec la commande de configuration globale ipv6 unicast-routing ?", "o": ["Les interfaces de routeur activées IPv6 commencent à envoyer des messages d’annonces de routeur ICMPv6.", "Il crée statiquement une adresse monodiffusion globale sur ce routeur.", "Toutes les interfaces du routeur seront automatiquement activées.", "Chaque interface de routeur génère une adresse link-local IPv6."], "a": ["Les interfaces de routeur activées IPv6 commencent à envoyer des messages d’annonces de routeur ICMPv6."], "e": ""}, {"n": 49, "q": "Un employé d’une grande entreprise se connecte à distance à l’entreprise en utilisant le nom d’utilisateur et le mot de passe appropriés. L’employé assiste à une vidéoconférence importante avec un client concernant une grande vente. Il est important que la qualité vidéo soit excellente pendant la réunion. L’employé ne sait pas qu’après une connexion efficace, la connexion au fournisseur d’accès Internet (FAI) de l’entreprise a échoué. La connexion secondaire, cependant, s’est activée en quelques secondes. La perturbation n’a pas été remarquée par l’employé ou les autres employés.Quelles sont les trois caractéristiques du réseau décrites dans ce scénario? (Choisissez trois réponses.)", "o": ["Intégrité", "Qualité de service", "Réseau sur courant électrique", "tolérance aux pannes", "évolutivité", "Sécurité"], "a": ["Qualité de service", "tolérance aux pannes", "Sécurité"], "e": ""}, {"n": 50, "q": "Une société possède un serveur de fichiers qui partage un dossier appelé Public. La stratégie de sécurité du réseau stipule que toute personne qui se connecte au serveur se voit attribuer des droits en lecture seule au dossier Public, tandis que les droits de modification ne sont attribués qu’au groupe d’administrateurs réseau. Quel composant est repris dans la structure de services réseau AAA ?", "o": ["autorisation", "automatisation", "authentification", "traçabilité"], "a": ["autorisation"], "e": "Une fois qu’un utilisateur est authentifié avec succès (connecté au serveur), l’autorisation est le processus consistant à déterminer à quelles ressources réseau l’utilisateur peut accéder et quelles opérations (telles que lire ou modifier) l’utilisateur peut effectuer."}, {"n": 52, "q": "Les protocoles utilisés dans la communication réseau pour transmettre des messages sur un réseau définissent trois conditions de transmission précises. Lesquelles ? (Choisissez trois propositions.)", "o": ["Le codage des messages", "L’installation du périphérique terminal", "Les caractéristiques des connecteurs", "Les options de remise du message", "La taille du message", "La sélection des supports"], "a": ["Le codage des messages", "Les options de remise du message", "La taille du message"], "e": ""}, {"n": 53, "q": "Quelles sont les deux causes courantes de dégradation du signal lors de l’utilisation du câblage UTP? (Choisissez deux réponses.)", "o": ["résiliation abusive", "blindage de mauvaise qualité dans le câble", "installation de câbles dans le conduit", "Câble ou connecteurs de mauvaise qualité", "perte de lumière sur de longues distances"], "a": ["résiliation abusive", "Câble ou connecteurs de mauvaise qualité"], "e": "Lorsqu’il est mal terminé, chaque câble est une source potentielle de dégradation des performances de la couche physique."}, {"n": 54, "q": "Quels sont les deux protocoles qui interviennent sur la couche supérieure de la pile de protocoles TCP/IP? (Choisissez deux réponses.)", "o": ["POP", "DNS", "TCP", "Ethernet", "UDP", "IP"], "a": ["POP", "DNS"], "e": ""}, {"n": 55, "q": "Quelles sont deux caractéristiques du protocole IP ? (Choisissez deux propositions.)", "o": ["Fonctionne indépendamment des supports réseau.", "Ne nécessite pas de connexion dédiée de bout en bout.", "Reconstitue dans le bon ordre les segments désordonnés côté destination.", "Retransmet les paquets en cas d’erreur.", "Garantit la remise des paquets."], "a": ["Fonctionne indépendamment des supports réseau.", "Ne nécessite pas de connexion dédiée de bout en bout."], "e": "Le protocole Internet (IP) est un protocole sans connexion et au mieux. Cela signifie qu’IP ne nécessite aucune connexion de bout en bout et ne garantit pas la livraison des paquets. IP est également indépendant du support, ce qui signifie qu’il fonctionne indépendamment du support réseau transportant les paquets."}, {"n": 56, "q": "Quel sous-réseau comprend l’adresse 192.168.1.96 en tant qu’adresse d’hôte utilisable ?", "o": ["192.168.1.64/26", "192.168.1.64/29", "192.168.1.32/27", "192.168.1.32/28"], "a": ["192.168.1.64/26"], "e": "Pour le sous-réseau 192.168.1.64/26, il y a 6 bits pour les adresses d’hôte, ce qui donne 64 adresses possibles. Cependant, les premier et dernier sous-réseaux sont les adresses de réseau et de diffusion pour ce sous-réseau. Par conséquent, la plage d’adresses d’hôtes pour ce sous-réseau est de 192.168.1.65 à 192.168.1.126. Les autres sous-réseaux ne contiennent pas l’adresse 192.168.1.96 comme adresse hôte valide."}, {"n": 57, "q": "Parmi les propositions suivantes, deux expliquent comment évaluer les modèles de flux de trafic et les types de trafic réseau à l’aide d’un analyseur de protocole. Lesquelles ? (Choisissez deux propositions.)", "o": ["Capturer uniquement le trafic WAN puisque le trafic web contribue le plus à la quantité de trafic sur un réseau", "Capturer uniquement le trafic des zones du réseau qui reçoivent la plus grande quantité de trafic, comme le data center", "Capturer le trafic pendant les périodes de pointe pour obtenir une représentation juste des différents types de trafic", "Capturer le trafic les weekends lorsque les employés n’utilisent pas le réseau", "Capturer le trafic sur plusieurs segments du réseau"], "a": ["Capturer le trafic pendant les périodes de pointe pour obtenir une représentation juste des différents types de trafic", "Capturer le trafic sur plusieurs segments du réseau"], "e": "Les modèles de flux de trafic doivent être collectés pendant les heures de pointe pour obtenir une bonne représentation des différents types de trafic. La capture doit également être effectuée sur différents segments de réseau, car une partie du trafic sera locale vers un segment particulier."}, {"n": 59, "q": "Quel serait l’ID d’interface d’une interface compatible IPv6 avec une adresse MAC de 1C-6F-65-C2-BD-F8 lorsque l’ID d’interface est généré à l’aide du processus EUI-64 ?", "o": ["1E6F:65FF:FEC2:BDF8", "0C6F:65FF:FEC2:BDF8", "C16F:65FF:FEC2:BDF8", "106F:65FF:FEC2:BDF8"], "a": ["1E6F:65FF:FEC2:BDF8"], "e": "Pour dériver l’ID d’interface EUI-64 en utilisant l’adresse MAC 1C-6F-65-C2-BD-F8, trois étapes sont suivies. Modifiez le septième bit de l’adresse MAC d’un 0 binaire à un 1 binaire qui change l’hexadécimal C en un hexadécimal E. Insérez les chiffres hexadécimaux FFFE au milieu de l’adresse. Réécrivez l’adresse au format IPv6. Les trois étapes, une fois terminées, donnent l’ID d’interface de 1E6F:65FF:FEC2:BDF8."}, {"n": 60, "q": "Un périphérique IPv6 envoie un paquet de données avec l’adresse de destination FF02::2. Quelle est la cible de ce paquet ?", "o": ["Tous les périphériques IPv6 sur le réseau", "Tous les périphériques IPv6 sur la liaison locale", "Tous les serveurs DHCP IPv6", "Tous les routeurs IPv6 configurés sur la liaison locale"], "a": ["Tous les routeurs IPv6 configurés sur la liaison locale"], "e": ""}, {"n": 61, "q": "Un client utilise la méthode SLAAC pour obtenir une adresse IPv6 pour son interface. Une fois qu’une adresse a été générée et appliquée à l’interface, que doit faire le client avant de pouvoir commencer à utiliser cette adresse IPv6 ?", "o": ["Il doit envoyer un message de sollicitation de voisin ICMPv6 pour s’assurer que l’adresse n’est pas déjà utilisée sur le réseau.", "Il doit envoyer un message DHCPv6 REQUEST au serveur DHCPv6 pour demander l’autorisation d’utiliser cette adresse.", "Il doit envoyer un message de sollicitation de routeur ICMPv6 pour déterminer la passerelle par défaut à utiliser.", "Il doit envoyer un message DHCPv6 INFORMATION-REQUEST pour obtenir l’adresse du serveur de noms de domaine (DNS)."], "a": ["Il doit envoyer un message de sollicitation de voisin ICMPv6 pour s’assurer que l’adresse n’est pas déjà utilisée sur le réseau."], "e": ""}, {"n": 62, "q": "Un employé mécontent utilise des outils de réseau sans fil gratuits pour déterminer des informations sur les réseaux sans fil de l’entreprise. Cette personne entend utiliser ces informations pour pirater le réseau sans fil. De quel type d’attaque s’agit-il?", "o": ["accès", "cheval de Troie", "Reconnaissance", "DoS"], "a": ["Reconnaissance"], "e": "Une attaque de reconnaissance est la découverte et la documentation non autorisées de divers réseaux informatiques, systèmes de réseau, ressources, applications, services ou vulnérabilités."}, {"n": 63, "q": "Quelles informations la commande show startup-config affiche-t-elle ?", "o": ["Le programme bootstrap de la mémoire morte", "L’image IOS copiée dans la mémoire vive", "Le contenu du fichier de configuration en cours dans la mémoire vive", "Le contenu du fichier de configuration enregistré dans la mémoire vive non volatile"], "a": ["Le contenu du fichier de configuration enregistré dans la mémoire vive non volatile"], "e": "La commande show startup-config affiche la configuration enregistrée située dans la NVRAM. La commande show running-config affiche le contenu du fichier de configuration en cours d’exécution situé dans la RAM."}, {"n": 65, "q": "Un administrateur réseau souhaite avoir le même masque de sous-réseau pour trois sous-réseaux sur un petit site. Le site a les réseaux et numéros de périphérique suivants :Sous-réseau A : téléphones IP – 10 adressesSous-réseau B : PC – 8 adressesSous-réseau C: Imprimantes – 2 adresses\nQuel masque de sous-réseau faudrait-il utiliser pour ces trois sous-réseaux ?", "o": ["255.255.255.248", "255.255.255.252", "255.255.255.240", "255.255.255.0"], "a": ["255.255.255.240"], "e": "Si le même masque doit être utilisé, le réseau avec le plus d’hôtes doit être examiné pour le nombre d’hôtes. Comme il s’agit de 10 hôtes, 4 bits d’hôte sont nécessaires. Le masque de sous-réseau /28 ou 255.255.255.240 serait approprié pour ces réseaux."}, {"n": 66, "q": "Quelles sont les trois normes couramment suivies pour la construction et l’installation de câblage? (Choisissez trois réponses.)", "o": ["brochage", "longueur des câbles", "couleur du connecteur", "types de connecteurs", "coût par mètre (pied)", "résistance à la traction de l’isolant en plastique"], "a": ["brochage", "longueur des câbles", "types de connecteurs"], "e": ""}, {"n": 68, "q": "Quelle technique utilise-t-on avec un câble à paires torsadées non blindées pour isoler les signaux des interférences issues d’une diaphonie ?", "o": ["Envelopper les paires de fils d’un blindage métallique", "Placer le câble à l’intérieur d’une gaine plastique souple", "Enrouler les brins en hélice pour former des paires torsadées", "Insérer des connecteurs reliés à la terre sur les extrémités du câble"], "a": ["Enrouler les brins en hélice pour former des paires torsadées"], "e": "Pour éviter les effets de la diaphonie, les fils des câbles UTP sont torsadés en paires. La torsion des fils ensemble provoque l’annulation des champs magnétiques de chaque fil."}, {"n": 69, "q": "Un administrateur réseau remarque qu’un câblage Ethernet nouvellement installé transporte des signaux de données déformés et altérés. Le nouveau câblage a été installé dans le plafond près des éclairages fluorescents et de l’équipement électrique. Quels facteurs peuvent interférer avec le câblage en cuivre et provoquer une distorsion des signaux et une corruption des données ? (Choisissez deux réponses.)", "o": ["EMI", "Interférences", "RFI", "Longueur étendue du câblage", "Atténuation du signal"], "a": ["EMI"], "e": ""}, {"n": 70, "q": "Quel service est fourni par DNS ?", "o": ["permet de transférer des données entre un client et un serveur.", "Utilise le cryptage pour sécuriser l’échange de texte, d’images graphiques, de sons et de vidéos sur le Web.", "Traduit des noms de domaines (par exemple, cisco.com) en adresses IP", "Ensemble de règles permettant d’échanger du texte, des graphiques, des sons, des vidéos et autres fichiers multimédia sur le web."], "a": ["Traduit des noms de domaines (par exemple, cisco.com) en adresses IP"], "e": ""}, {"n": 72, "q": "Quelles sont les fonctions fournies par la couche réseau ? (Choisissez deux réponses.)", "o": ["Fournir des connexions de bout en bout dédiées", "Diriger les paquets de données vers les hôtes de destination sur d’autres réseaux", "Placer des données sur le support réseau", "Fournir des périphériques finaux dotés d’un identificateur de réseau unique", "Transport de données entre des processus s’exécutant sur les hôtes source et de destination"], "a": ["Diriger les paquets de données vers les hôtes de destination sur d’autres réseaux", "Fournir des périphériques finaux dotés d’un identificateur de réseau unique"], "e": ""}, {"n": 73, "q": "Quelles propositions sont correctes dans le cadre de la comparaison des en-têtes de paquet IPv4 et IPv6 ? (Choisissez deux réponses.)", "o": ["Le champ Durée de vie d’IPv4 a été remplacé par le champ Limite de nombre de sauts dans IPv6.", "Le nom du champ Somme de contrôle d’en-tête d’IPv4 est conservé dans IPv6.", "Le champ Version d’IPv4 n’est pas conservé dans IPv6.", "Le champ Adresse de destination est une nouveauté d’IPv6.", "Le nom du champ Adresse source d’IPv4 est conservé dans IPv6."], "a": ["Le champ Durée de vie d’IPv4 a été remplacé par le champ Limite de nombre de sauts dans IPv6.", "Le nom du champ Adresse source d’IPv4 est conservé dans IPv6."], "e": ""}, {"n": 74, "q": "Quelle caractéristique décrit un virus?", "o": ["logiciel sur un routeur qui filtre le trafic en fonction des adresses IP ou des applications", "un protocole de tunnel qui fournit aux utilisateurs distants un accès sécurisé au réseau d’une organisation", "un périphérique réseau qui filtre l’accès et le trafic entrant dans un réseau", "logiciel qui identifie les menaces qui se propagent rapidement"], "a": ["logiciel qui identifie les menaces qui se propagent rapidement"], "e": ""}, {"n": 75, "q": "Trois employés de banque utilisent le réseau d’entreprise. Le premier employé utilise un navigateur Web pour afficher une page Web de la société afin de lire des annonces. Le deuxième employé accède à la base de données d’entreprise pour effectuer des transactions financières. Le troisième employé participe à une importante conférence audio en direct avec d’autres responsables de l’entreprise basés dans les filiales. Si la qualité de service est implémentée sur ce réseau, quelles seront les priorités, des plus importantes au moins importantes, des différents types de données ?", "o": ["conférence audio, transactions financières, page Web", "transactions financières, page Web, conférence audio", "conférence audio, page Web, transactions financières", "transactions financières, conférence audio, page Web"], "a": ["conférence audio, transactions financières, page Web"], "e": "Les mécanismes de qualité de service permettent d’établir des stratégies de gestion des files d’attente qui imposent des priorités pour différentes catégories de données d’application. Ainsi, cette mise en file d’attente permet aux données vocales d’avoir la priorité sur les données de transaction, qui ont la priorité sur les données Web."}, {"n": 76, "q": "Un administrateur réseau ajoute un nouveau réseau local à une filiale. Le nouveau réseau local doit prendre en charge 200 périphériques connectés. Quel est le plus petit masque réseau que l’administrateur réseau peut utiliser pour le nouveau réseau?", "o": ["255.255.255.192", "255.255.255.0", "255.255.255.224", "255.255.255.240"], "a": ["255.255.255.0"], "e": ""}, {"n": 77, "q": "Qu’est-ce qu’une fonction de la couche de liaison de données?", "o": ["fournit des données entre deux applications", "fournit une livraison de bout en bout de données entre les hôtes", "prévoit l’échange de trames sur un média local commun", "fournit la mise en forme des données"], "a": ["prévoit l’échange de trames sur un média local commun"], "e": ""}, {"n": 78, "q": "Un hôte tente d’envoyer un paquet à un périphérique sur un segment du réseau local distant, mais il n’y a actuellement aucun mappage dans son cache ARP. Comment le périphérique obtient-il une adresse MAC de destination ?", "o": ["Il envoie la trame avec une adresse MAC de diffusion.", "Il envoie une requête au serveur DNS pour l’adresse MAC de destination.", "Il envoie une requête ARP pour l’adresse MAC de la passerelle par défaut.", "Il envoie la trame et utilise sa propre adresse MAC comme destination.", "Il envoie une requête ARP pour l’adresse MAC du périphérique de destination."], "a": ["Il envoie la trame et utilise sa propre adresse MAC comme destination."], "e": ""}, {"n": 89, "q": "Quelle méthode de commutation supprime les trames qui ne passent pas avec succès le contrôle FCS ?", "o": ["commutation « cut-through »", "commutation sans frontières", "mise en mémoire tampon des ports d’entrée", "commutation par « stockage et retransmission »"], "a": ["commutation par « stockage et retransmission »"], "e": ""}, {"n": 81, "q": "Quel est l’avantage pour les petites entreprises d’adopter IMAP au lieu de POP ?", "o": ["IMAP envoie et récupère les e-mails, tandis que POP récupère uniquement les e-mails.", "Les messages sont stockés sur les serveurs de messagerie jusqu’à ce qu’ils soient manuellement supprimés sur le client de messagerie.", "Lorsque l’utilisateur se connecte à un serveur POP, des copies des messages sont conservées dans le serveur de messagerie pendant une courte période, mais IMAP les conserve pendant une longue période.", "POP permet uniquement au client de stocker les messages de façon centralisée, tandis qu’IMAP permet un stockage distribué."], "a": ["Les messages sont stockés sur les serveurs de messagerie jusqu’à ce qu’ils soient manuellement supprimés sur le client de messagerie."], "e": "IMAP et POP sont des protocoles utilisés pour récupérer les e-mails. L’avantage d’utiliser IMAP au lieu de POP est que lorsque l’utilisateur se connecte à un serveur compatible IMAP, des copies des messages sont téléchargées vers l’application cliente. IMAP stocke ensuite les messages électroniques sur le serveur jusqu’à ce que l’utilisateur supprime manuellement ces messages."}, {"n": 84, "q": "Un utilisateur se plaint qu’une page Web externe prend plus de temps que la normale pour se charger. La page Web finit par se charger sur la machine utilisateur. Quel outil le technicien doit-il utiliser avec les privilèges d’administrateur pour localiser le problème dans le réseau?", "o": ["nslookup", "ping", "tracert", "ipconfig /displaydns"], "a": ["tracert"], "e": ""}, {"n": 85, "q": "Quelle plage d’adresses link-local peut être attribuée à une interface IPv6 ?", "o": ["FEC0::/10", "FF00::/8", "FE80::/10", "FDEE::/7"], "a": ["FE80::/10"], "e": "Les adresses lien-local sont comprises entre FE80::/10 et FEBF::/10. La spécification IPv6 d’origine définissait les adresses locales du site et utilisait la plage de préfixes FEC0::/10, mais ces adresses ont été dépréciées par l’IETF en faveur d’adresses locales uniques. FDEE::/7 est une adresse locale unique car elle est comprise entre FC00::/7 et FDFF::/7. Les adresses de multidiffusion IPv6 ont le préfixe FF00::/8."}, {"n": 87, "q": "Un serveur reçoit un paquet client. Le numéro de port de destination du paquet est 22. Quelle application de service le client demande-t-il?", "o": ["TFTP", "SSH", "DHCP", "DNS"], "a": ["SSH"], "e": ""}, {"n": 88, "q": "Quelles sont les deux fonctions d’exécution sur la sous-couche LLC de la couche de liaison de données OSI pour faciliter la communication Ethernet? (Choisissez deux réponses.)", "o": ["Place les informations dans la trame qui indique le protocole de couche réseau encapsulé pour la trame.", "intègre des flux de couche 2 entre 10 Gigabit Ethernet sur fibre et 1 Gigabit Ethernet sur cuivre", "met en oeuvre CSMA/CD sur un support semi-duplex partagé hérité", "Met en œuvre un processus de délimitation des champs dans une trame Ethernet 2", "permet à IPv4 et IPv6 d’utiliser le même support physique"], "a": ["Place les informations dans la trame qui indique le protocole de couche réseau encapsulé pour la trame.", "permet à IPv4 et IPv6 d’utiliser le même support physique"], "e": ""}, {"n": 89, "q": "Citez deux caractéristiques communes aux protocoles TCP et UDP. (Choisissez deux propositions.)", "o": ["La numérotation des ports", "Connexion en trois étapes", "L’utilisation de sommes de contrôle", "La possibilité de transmette des données voix numérisées", "Une communication sans connexion", "La taille de la fenêtre par défaut"], "a": ["La numérotation des ports", "L’utilisation de sommes de contrôle"], "e": "TCP et UDP utilisent tous deux les numéros de port source et de destination pour distinguer les différents flux de données et pour transmettre les bons segments de données aux bonnes applications. La vérification des erreurs de l’en-tête et des données est effectuée par les deux protocoles en utilisant un calcul de somme de contrôle pour déterminer l’intégrité des données reçues. TCP est orienté connexion et utilise une poignée de main à trois pour établir une connexion initiale. TCP utilise également la fenêtre pour réguler la quantité de trafic envoyé avant de recevoir un accusé de réception. UDP est sans connexion et est le meilleur protocole pour transporter des signaux VoIP numérisés."}, {"n": 90, "q": "Un administrateur réseau ajoute un nouveau réseau local à une filiale. Le nouveau réseau local doit prendre en charge 61 périphériques connectés. Quel est le plus petit masque réseau que l’administrateur réseau peut utiliser pour le nouveau réseau?", "o": ["255.255.255.192", "255.255.255.224", "255.255.255.128", "255.255.255.0"], "a": ["255.255.255.192"], "e": ""}, {"n": 91, "q": "Un utilisateur tente sans succès d’accéder à l’adresse http://www.cisco.com/. Quelles sont les deux valeurs de configuration à définir sur l’hôte pour autoriser cet accès ? (Choisissez deux propositions.)", "o": ["Adresse MAC d’origine", "Serveur DNS", "Numéro du port source", "Serveur HTTP", "Passerelle par défaut"], "a": ["Serveur DNS"], "e": ""}, {"n": 92, "q": "Quel service est fourni par DHCP?", "o": ["Une application qui permet les discussions en ligne en temps réel entre les utilisateurs distants.", "Permet l’accès à distance aux périphériques et serveurs réseau.", "Utilise le chiffrement pour fournir un accès distant sécurisé aux périphériques et serveurs réseau.", "Affecte dynamiquement des adresses IP aux périphériques terminaux et intermédiaires."], "a": ["Affecte dynamiquement des adresses IP aux périphériques terminaux et intermédiaires."], "e": ""}, {"n": 93, "q": "Le bloc d’adresses IPv6 2001:db8:0:ca00::/56 est attribué à une organisation. Combien de sous-réseaux peuvent être créés sans utiliser de bits dans l’espace d’ID d’interface ?", "o": ["512", "256", "4 096", "1 024"], "a": ["256"], "e": ""}, {"n": 94, "q": "Un technicien utilise plusieurs applications sur un ordinateur connecté à Internet. Comment l’ordinateur peut-il suivre le flux de données entre plusieurs sessions d’application et faire en sorte que chaque application reçoit les flux de paquets qu’elle doit recevoir ?", "o": ["Le suivi du flux de données se fait selon le numéro de port source utilisé par chaque application.", "Le suivi du flux de données se fait selon l’adresse MAC de destination utilisée par l’ordinateur du technicien.", "Le suivi du flux de données se fait selon l’adresse IP de destination utilisée par l’ordinateur du technicien.", "Le suivi du flux de données se fait selon l’adresse IP source utilisée par l’ordinateur du technicien."], "a": ["Le suivi du flux de données se fait selon le numéro de port source utilisé par chaque application."], "e": "Le numéro de port source d’une application est généré de manière aléatoire et utilisé pour suivre individuellement chaque session de connexion à Internet. Chaque application utilisera un numéro de port source unique pour fournir une communication simultanée à partir de plusieurs applications via Internet."}, {"n": 95, "q": "Pourquoi un commutateur de couche 2 nécessite-t-il une adresse IP ?", "o": ["Pour permettre au commutateur d’être géré à distance", "Pour permettre au commutateur d’envoyer des trames de diffusion vers des PC connectés", "Pour permettre au commutateur de fonctionner en tant que passerelle par défaut", "Pour permettre au commutateur de recevoir des trames provenant de PC connectés"], "a": ["Pour permettre au commutateur d’être géré à distance"], "e": "Un commutateur, en tant que périphérique de couche 2, n’a pas besoin d’une adresse IP pour transmettre des trames aux périphériques connectés. Cependant, lorsqu’un commutateur est accessible à distance via le réseau, il doit avoir une adresse de couche 3. L’adresse IP doit être appliquée à une interface virtuelle plutôt qu’à une interface physique. Les routeurs, et non les commutateurs, fonctionnent comme des passerelles par défaut."}, {"n": 96, "q": "De quel type de menace à la sécurité parle-t-on lorsqu’un tableur exécuté en tant que logiciel complémentaire désactive le pare-feu logiciel local ?", "o": ["dépassement de mémoire tampon", "DoS", "attaques en force", "cheval de Troie"], "a": ["cheval de Troie"], "e": "Un cheval de Troie est un logiciel qui fait quelque chose de dangereux, mais qui est caché dans un code logiciel légitime. Une attaque par déni de service (DoS) entraîne l’interruption des services réseau pour les utilisateurs, les périphériques réseau ou les applications. Une attaque par force brute consiste généralement à essayer d’accéder à un périphérique réseau. Un débordement de mémoire tampon se produit lorsqu’un programme tente de stocker plus de données dans un emplacement mémoire qu’il ne peut en contenir."}, {"n": 98, "q": "Quelle est l’une des principales caractéristiques de la couche de liaison de données?", "o": ["Il convertit un flux de bits de données en un code prédéfini.", "Il empêche le protocole de couche supérieure de connaître le support physique à utiliser dans la communication.", "Il accepte les paquets de la couche 3 et décide du chemin par lequel le paquet doit être transmis à un réseau distant.", "La couche physique doit générer les signaux électriques, optiques ou sans fil qui représentent le 1 et le 0 sur le support."], "a": ["Il empêche le protocole de couche supérieure de connaître le support physique à utiliser dans la communication."], "e": ""}, {"n": 99, "q": "Quel est le caractère d’un NIC qui le mettrait au niveau de la couche de liaison de données du modèle OSI ?", "o": ["Raccordez le câble Ethernet.", "La pile de protocoles TCP/IP", "Adresse MAC", "Adresse IP", "Port RJ-45"], "a": ["Adresse MAC"], "e": "La couche de liaison de données décrit l’accès aux supports et l’adressage physique. L’encodage d’une adresse MAC sur une NIC la situe sur cette couche. Les ports et les câbles sont placés sur la couche physique du modèle OSI . Les adresses IP sont placées sur la couche réseau. La pile de protocoles TCP/IP décrit un modèle différent."}, {"n": 100, "q": "Deux requêtes ping ont été exécutées depuis un hôte sur un réseau local. La première requête ping a été exécutée sur l’adresse IP de la passerelle par défaut de l’hôte et elle a échoué. La deuxième requête ping a été exécutée sur l’adresse IP d’un hôte situé en dehors du réseau local et elle a abouti. Quelle est la cause probable de l’échec de la requête ping ?", "o": ["La passerelle par défaut est configurée avec une adresse IP incorrecte.", "Des règles de sécurité sont appliquées à la passerelle par défaut, ce qui l’empêche de traiter les requêtes ping.", "La passerelle par défaut n’est pas opérationnelle.", "La pile TCP/IP sur la passerelle par défaut ne fonctionne pas correctement."], "a": ["Des règles de sécurité sont appliquées à la passerelle par défaut, ce qui l’empêche de traiter les requêtes ping."], "e": ""}, {"n": 102, "q": "Un technicien en réseau étudie l’utilisation du câblage à fibre optique dans un nouveau centre technologique. Quels deux problèmes devraient être pris en compte avant de mettre en œuvre des supports à fibres optiques? (Choisissez deux réponses.)", "o": ["La fibre optique fournit une capacité de données plus élevée mais est plus coûteuse que le câblage en cuivre.", "Le câble à fibre optique est capable de résister à une manipulation rugueuse.", "Le câblage à fibre optique est sensible à la perte de signal grâce au RFI.", "Le câblage à fibre optique nécessite une mise à la terre spécifique pour être immunisé contre les EMI.", "Le câblage à fibres optiques nécessite une expertise différente en matière de terminaison et d’épissage de ce que nécessite le câblage en cuivre."], "a": ["La fibre optique fournit une capacité de données plus élevée mais est plus coûteuse que le câblage en cuivre.", "Le câblage à fibres optiques nécessite une expertise différente en matière de terminaison et d’épissage de ce que nécessite le câblage en cuivre."], "e": "Les supports en fibre optique sont plus chers que le câblage en cuivre utilisé sur la même distance. Les câbles à fibre optique utilisent de la lumière au lieu d’un signal électrique, donc EMI et RFI ne sont pas des problèmes. Cependant, la fibre optique nécessite des compétences différentes pour se terminer et épisser."}, {"n": 103, "q": "Que se passe-t-il lorsque la commande transport input ssh est entrée sur les lignes vty du switch?", "o": ["Le commutateur nécessite une combinaison nom d’utilisateur/mot de passe pour l’accès à distance.", "Le client SSH sur le commutateur est activé.", "La communication entre le commutateur et les utilisateurs distants est cryptée.", "Le commutateur nécessite des connexions à distance via un logiciel client propriétaire."], "a": ["La communication entre le commutateur et les utilisateurs distants est cryptée."], "e": "La commande transport input ssh lorsqu’elle est saisie sur le commutateur vty (lignes de terminal virtuel) chiffrera toutes les connexions telnet contrôlées entrantes."}, {"n": 105, "q": "Lorsque la configuration d’un commutateur comprend un seuil d’erreur défini par l’utilisateur pour chaque port, à quelle méthode de commutation le commutateur revient-il si le seuil est atteint ?", "o": ["fragment-free", "cut-through", "store-and-forward", "fast-forward"], "a": [], "e": ""}, {"n": 106, "q": "Quels sont les deux types de trafic qui utilisent le protocole RTP (Real-Time Transport Protocol)? (Choisissez deux réponses.)", "o": ["Voix", "P2P (peer-to-peer)", "transfert de fichier", "Web", "Vidéo"], "a": [], "e": ""}, {"n": 107, "q": "Quels sont les deux messages ICMPv6 qui ne sont pas présents dans ICMP pour IPv4? (Choisissez deux réponses.)", "o": ["Sollicitation de voisin", "Destination injoignable", "Confirmation de l’hôte", "Redirection de la route", "Annonce de routeur", "Dépassement du délai"], "a": [], "e": ""}, {"n": 108, "q": "Quel service est fourni par SMTP?", "o": ["Permet l’accès à distance aux périphériques et serveurs réseau.", "Une application qui permet les discussions en ligne en temps réel entre les utilisateurs distants.", "Permet aux clients d’envoyer des courriels à un serveur de messagerie et aux serveurs d’envoyer des courriels à d’autres serveurs.", "Utilise le chiffrement pour fournir un accès distant sécurisé aux périphériques et serveurs réseau."], "a": [], "e": ""}, {"n": 109, "q": "Quels sont les deux types de messages ICMPv6 qui doivent être autorisés par les listes de contrôle d’accès IPv6 pour permettre la résolution des adresses de couche 3 en adresses MAC de couche 2 ? (Choisissez deux réponses.)", "o": ["Sollicitation de voisin", "une requête d’écho", "une réponse d’écho", "Annonce de routeur", "Annonce de voisin", "Sollicitation de routeur"], "a": [], "e": ""}, {"n": 110, "q": "Un administrateur réseau cherche à préserver la confidentialité de l’ID utilisateur, du mot de passe et du contenu des sessions lorsqu’il configure une connexion distante CLI gérée par un commutateur. Quel est le mode d’accès le plus approprié ?", "o": ["SSH", "AUX", "Console", "Telnet"], "a": [], "e": ""}, {"n": 111, "q": "Un serveur reçoit un paquet client. Le numéro de port de destination du paquet est 110. Quelle application de service le client demande-t-il?", "o": ["SMTP", "DHCP", "POP3", "DNS"], "a": [], "e": ""}, {"n": 114, "q": "Quelles sont les deux fonctions exécutées sur la sous-couche LLC de la couche de liaison de données OSI pour faciliter la communication Ethernet ? (Choisissez deux propositions.)", "o": ["applique les adresses MAC source et destination à la trame Ethernet", "implémente CSMA/CD sur un support semi-duplex partagé hérité", "Place les informations dans la trame qui indique le protocole de couche réseau encapsulé pour la trame.", "intègre des flux de couche 2 entre 10 Gigabit Ethernet sur fibre et 1 Gigabit Ethernet sur cuivre", "ajoute des informations de contrôle Ethernet aux données du protocole réseau"], "a": [], "e": "La couche liaison de données est en fait divisée en deux sous-couches : + Logical Link Control (LLC) : Cette sous-couche supérieure définit les processus logiciels qui fournissent des services aux protocoles de la couche réseau. Il place des informations dans la trame qui identifient le protocole de couche réseau utilisé pour la trame. Ces informations permettent à plusieurs protocoles de couche 3, tels que IPv4 et IPv6, d’utiliser la même interface réseau et le même support.+ Media Access Control (MAC) : Cette sous-couche inférieure définit les processus d’accès aux médias exécutés par le matériel. Il fournit l’adressage de la couche liaison de données et la délimitation des données en fonction des exigences de signalisation physique du support et du type de protocole de couche liaison de données utilisé."}, {"n": 115, "q": "Quelles sont les deux méthodes les plus efficaces pour la protection contre les programmes malveillants ? (Choisissez deux réponses.)", "o": ["Installer et mettre à jour un logiciel antivirus", "Implémenter RAID", "Implémenter des mots de passe forts", "Implémenter des pare-feu réseau", "Implémenter un VPN", "Mettre à jour le système d’exploitation et d’autres logiciels d’application"], "a": ["Installer et mettre à jour un logiciel antivirus", "Mettre à jour le système d’exploitation et d’autres logiciels d’application"], "e": "Un spécialiste de la cybersécurité doit connaître les technologies et les mesures utilisées comme contre-mesures pour protéger l’organisation contre les menaces et les vulnérabilités."}, {"n": 118, "q": "Un utilisateur envoie une requête HTTP à un serveur Web sur un réseau distant. Pendant l’encapsulation de cette requête, quelles informations sont ajoutées au champ d’adresse d’une trame pour indiquer la destination ?", "o": ["L’adresse MAC de l’hôte de destination", "L’adresse MAC de la passerelle par défaut", "Le domaine réseau de l’hôte de destination", "L’adresse IP de la passerelle par défaut"], "a": ["L’adresse MAC de la passerelle par défaut"], "e": "Une trame est encapsulée avec les adresses MAC source et destination. Le périphérique source ne connaîtra pas l’adresse MAC de l’hôte distant. Une requête ARP sera envoyée par la source et sera répondue par le routeur. Le routeur répondra avec l’adresse MAC de son interface, celle qui est connectée au même réseau que la source."}, {"n": 120, "q": "Un serveur reçoit un paquet client. Le numéro de port de destination du paquet est 21. Quelle application de service le client demande-t-il?", "o": ["DHCP", "SSH", "FTP", "TFTP"], "a": ["FTP"], "e": ""}, {"n": 121, "q": "Quel service est fourni par POP3 ?", "o": ["Une application qui permet de chatter en temps réel entre utilisateurs distants.", "Utilise le chiffrement pour fournir un accès distant sécurisé aux périphériques et serveurs réseau.", "Récupère le courrier électronique à partir du serveur en téléchargeant le courrier électronique vers l’application de messagerie locale du client.", "Permet l’accès à distance aux périphériques et serveurs réseau."], "a": ["Récupère le courrier électronique à partir du serveur en téléchargeant le courrier électronique vers l’application de messagerie locale du client."], "e": ""}, {"n": 122, "q": "Quel masque de sous-réseau faut-il utiliser si un réseau IPv4 comporte 40 terminaux nécessitant des adresses IP et que l’on veut éviter de gaspiller l’espace d’adressage ?", "o": ["255.255.255.0", "255.255.255.240", "255.255.255.128", "255.255.255.192", "255.255.255.224"], "a": [], "e": ""}, {"n": 123, "q": "Un serveur reçoit un paquet client. Le numéro de port de destination du paquet est 80. Quelle application de service le client demande-t-il?", "o": ["SMTP", "DNS", "HTTP", "DHCP"], "a": ["HTTP"], "e": ""}, {"n": 124, "q": "Un administrateur réseau ajoute un nouveau réseau local à une filiale. Le nouveau réseau local doit prendre en charge 10 périphériques connectés. Quel est le plus petit masque n pour transférer des messages via un interréseau ?", "o": ["application", "transport", "accès réseau", "internet"], "a": ["internet"], "e": "La couche réseau du modèle OSI correspond directement à la couche Internet du modèle TCP/IP et est utilisée pour décrire les protocoles qui adressent et acheminent les messages via un interréseau."}, {"n": 16, "q": "Quelle caractéristique décrit le vol d’identité ?", "o": ["l’utilisation d’identifiants volés pour accéder à des données privées", "logiciel sur un routeur qui filtre le trafic en fonction des adresses IP ou des applications", "logiciel qui identifie les menaces à propagation rapide", "un protocole de tunneling qui fournit aux utilisateurs distants un accès sécurisé au réseau d’une organisation"], "a": [], "e": ""}, {"n": 25, "q": "Quelles sont les deux informations affichées dans la sortie de la commande show ip interface brief ? (Choisissez deux réponses.)", "o": ["Adresses IP", "description des interfaces", "Adresses MAC", "adresses de saut suivant", "Statuts de la couche 1", "Paramètres de vitesse et de duplex"], "a": [], "e": "La commande show ip interface brief affiche l’adresse IP de chaque interface, ainsi que l’état opérationnel des interfaces au niveau de la couche 1 et de la couche 2. Afin de voir l’interface descriptions et paramètres de vitesse et de duplex, utilisez la commande show running-config interface. Les adresses de saut suivant sont affichées dans la table de routage avec la commande show ip route, et l’adresse MAC d’une interface peut être vue avec la commande show interfaces."}, {"n": 50, "q": "Un administrateur réseau ajoute un nouveau réseau local à une succursale. Le nouveau LAN doit prendre en charge 90 appareils connectés. Quel est le plus petit masque de réseau que l’administrateur réseau peut utiliser pour le nouveau réseau ?", "o": ["255.255.255.128", "255.255.255.240", "255.255.255.248", "255.255.255.224"], "a": [], "e": ""}, {"n": 60, "q": "Quel service est fourni par HTTP ?", "o" let S=[],sec=0,t=null,done=false;const $=x=>document.getElementById(x),quiz=$('quiz'),p=$('p'),tm=$('tm'),sel=$('sel'),note=$('note');function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ft(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function chosen(i){return [...document.querySelectorAll(`[name=q${i}]:checked`)].map(x=>x.value)}function same(a,b){return a.length==b.length&&[...a].sort().every((x,i)=>x==[...b].sort()[i])}function prog(){p.textContent=S.filter((_,i)=>chosen(i).length).length+'/'+S.length+' répondu'}function init(){[10,20,32,50,Q.length].filter((v,i,a)=>v<=Q.length&&a.indexOf(v)==i).forEach(v=>sel.add(new Option(v==Q.length?'Toutes les questions':v+' questions',v)));sel.value=Math.min(32,Q.length)}function render(){done=false;$('res').innerHTML='';$('val').style.display='';$('new').style.display='none';sec=0;tm.textContent='00:00';clearInterval(t);t=setInterval(()=>{tm.textContent=ft(++sec)},1000);S=sh(Q).slice(0,+sel.value).map(q=>({...q,o:sh(q.o)}));let miss=S.filter(q=>!q.a.length).length;note.style.display=miss?'':'none';note.textContent=miss?miss+" question(s) sans réponse rouge détectable dans le fichier source : elles restent visibles mais ne comptent pas dans le score.":'';quiz.innerHTML=S.map((q,i)=>`<section class="q" data-i="${i}"><div class="qt">${i+1}. ${esc(q.q)}</div><div class="meta">Source ${q.n} · ${q.a.length>1?q.a.length+' réponses attendues':q.a.length?'1 réponse attendue':'réponse source non détectée'}</div>${q.o.map(o=>`<label class="ch"><input type="${q.a.length>1?'checkbox':'radio'}" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span><span class="tag"></span></label>`).join('')}<div class="exp"></div></section>`).join('');prog()}function validate(){if(done)return;done=true;clearInterval(t);let sc=0,gr=0;S.forEach((q,i)=>{let c=chosen(i),A=new Set(q.a),card=document.querySelector(`[data-i='${i}']`);if(q.a.length){gr++;if(same(c,q.a))sc++}card.querySelectorAll('.ch').forEach(l=>{let inp=l.querySelector('input'),v=inp.value,pick=c.includes(v),ok=A.has(v),tag=l.querySelector('.tag');if(ok){l.classList.add('ok');tag.textContent=pick?'juste':'bonne réponse'}if(pick&&!ok){l.classList.add('ko');tag.textContent='votre choix'}inp.disabled=true});let e=card.querySelector('.exp');e.innerHTML=(q.a.length?'<b>Réponse correcte :</b> '+q.a.map(esc).join(' ; '):'<b>Réponse correcte :</b> non détectée dans le fichier source.')+(c.length?'<br><b>Votre réponse :</b> '+c.map(esc).join(' ; '):'<br><b>Votre réponse :</b> aucune réponse sélectionnée.')+(q.e?'<br><br><b>Explication :</b> '+esc(q.e):'');e.style.display='block'});$('res').innerHTML=`<div class="res">Score : ${sc}/${gr} · ${gr?Math.round(sc/gr*100):0}%<br><small>${S.length-gr} question(s) non notée(s). Temps : ${ft(sec)}.</small></div>`;$('val').style.display='none';$('new').style.display='';scrollTo({top:0,behavior:'smooth'})}init();if(localStorage.ccnaDark=='1')document.body.classList.add('dark');$('dark').onclick=()=>{document.body.classList.toggle('dark');localStorage.ccnaDark=document.body.classList.contains('dark')?'1':'0'};quiz.onchange=prog;sel.onchange=render;$('val').onclick=validate;$('new').onclick=render;render()</script></body></html>
